<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Search by Name (Paging)</title></head>
<body>
  <h2>Tìm sản phẩm theo tên </h2>

  <form th:action="@{/product/search-name}" method="get">
    <input type="text" name="q" th:value="${q}" placeholder="Nhập tên...">
    <input type="hidden" name="size" th:value="${page.size}">
    <button type="submit">Tìm</button>
    <a th:href="@{/product/list}">Quay lại</a>
  </form>

  <table border="1" style="width:100%">
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Price</th>
      <th>Create Date</th>
    </tr>
    <tr th:each="p : ${page.content}">
      <td th:text="${p.id}"></td>
      <td th:text="${p.name}"></td>
      <td th:text="${p.price}"></td>
      <td th:text="${#dates.format(p.createDate,'yyyy-MM-dd')}"></td>
    </tr>
    <tr th:if="${page.empty}">
      <td colspan="4">No data</td>
    </tr>
  </table>

  <ul>
    <li>Số thực thể hiện tại: <span th:text="${page.numberOfElements}"></span></li>
    <li>Trang số: <span th:text="${page.number}"></span></li>
    <li>Kích thước trang: <span th:text="${page.size}"></span></li>
    <li>Tổng số thực thể: <span th:text="${page.totalElements}"></span></li>
    <li>Tổng số trang: <span th:text="${page.totalPages}"></span></li>
  </ul>

  <div>
    <span th:text="'Trang ' + (${page.number}+1) + ' / ' + (${page.totalPages}==0?1:${page.totalPages})"></span>
  </div>

  <div>
    <a th:if="${!page.first}" th:href="@{/product/search-name(page=0,size=${page.size},q=${q})}">First</a>
    <span th:if="${page.first}">First</span>
    |
    <a th:if="${page.hasPrevious()}" th:href="@{/product/search-name(page=${page.number-1},size=${page.size},q=${q})}">Previous</a>
    <span th:if="${!page.hasPrevious()}">Previous</span>
    |
    <a th:if="${page.hasNext()}" th:href="@{/product/search-name(page=${page.number+1},size=${page.size},q=${q})}">Next</a>
    <span th:if="${!page.hasNext()}">Next</span>
    |
    <a th:if="${!page.last && page.totalPages>0}" th:href="@{/product/search-name(page=${page.totalPages-1},size=${page.size},q=${q})}">Last</a>
    <span th:if="${page.last || page.totalPages==0}">Last</span>
  </div>
</body>
</html>
