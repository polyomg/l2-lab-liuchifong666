<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Search by Price</title></head>
<body>
  <h2>Search Products by Price Range</h2>

  <form th:action="@{/product/search-price}" method="get">
    <label>Min</label>
    <input type="number" step="0.01" name="min" th:value="${min}">
    <label>Max</label>
    <input type="number" step="0.01" name="max" th:value="${max}">
    <button type="submit">Search</button>
    <a th:href="@{/product/list}">Back</a>
  </form>

  <h3>Results</h3>
  <table border="1" style="width:100%">
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Price</th>
      <th>Create Date</th>
    </tr>
    <tr th:each="p : ${items}">
      <td th:text="${p.id}"></td>
      <td th:text="${p.name}"></td>
      <td th:text="${p.price}"></td>
      <td th:text="${#dates.format(p.createDate, 'yyyy-MM-dd')}"></td>
    </tr>
  </table>
</body>
</html>
